# Pacote .deb do agente (nfpm, gratuito, MIT). Gerado pelo CI.
name: digivant-agent
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Digivant Pulse
description: |
  Agente do Digivant Pulse para Linux (desktop X11). Registra, só no horário de trabalho e com o Termo de
  Ciência aceito: programa em uso, título da janela e atividade de teclado/mouse (nunca o que é digitado).
homepage: https://github.com/Magnataflowless/vantor-pulse-agent
license: MIT
recommends:
  - zenity
contents:
  - src: ./dist/pkg/digivant-agent
    dst: /usr/bin/digivant-agent
    file_info: { mode: 0755 }
  - src: ./packaging/linux/digivant-agent.service
    dst: /usr/lib/systemd/user/digivant-agent.service
scripts:
  postinstall: ./packaging/linux/postinstall.sh
  preremove: ./packaging/linux/preremove.sh
