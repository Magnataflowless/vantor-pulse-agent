# Pacote .deb do agente (nfpm, gratuito, MIT). Gerado pelo CI.
name: vantor-agent
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Vantor Pulse
description: |
  Agente do Vantor Pulse para Linux (desktop X11). Registra, só no horário de trabalho e com o Termo de
  Ciência aceito: programa em uso, título da janela e atividade de teclado/mouse (nunca o que é digitado).
homepage: https://github.com/Magnataflowless/vantor-pulse-agent
license: MIT
recommends:
  - zenity
contents:
  - src: ./dist/vantor-agent-linux-${ARCH}
    dst: /usr/bin/vantor-agent
    file_info: { mode: 0755 }
  - src: ./packaging/linux/vantor-agent.service
    dst: /usr/lib/systemd/user/vantor-agent.service
scripts:
  postinstall: ./packaging/linux/postinstall.sh
  preremove: ./packaging/linux/preremove.sh
